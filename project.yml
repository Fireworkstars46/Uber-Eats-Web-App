name: UberEatsWeb

options:
  bundleIdPrefix: com.garrettcarey
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  UberEatsWeb:
    type: application
    platform: iOS
    sources:
      - path: UberEatsWeb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrettcarey.ubereatsweb
        PRODUCT_NAME: UberEatsWeb
        INFOPLIST_FILE: UberEatsWeb/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
